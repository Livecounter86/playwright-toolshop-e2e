# Toolshop, the app under test, from prebuilt images.
# Based on docker-compose.prod.yml from testsmith-io/practice-software-testing;
# the web service is plain nginx with docker/nginx.conf, because the Toolshop web image is arm64-only.
# UI: http://localhost:4200, API: http://localhost:8091
name: toolshop

services:
  mariadb:
    image: yobasystems/alpine-mariadb:10.6.11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: user
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: toolshop

  laravel-api:
    image: testsmith/practice-software-testing-sprint5-api
    platform: linux/amd64
    environment:
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: 1
      DB_HOST: mariadb
      DB_PORT: 3306
      host: localhost
    depends_on:
      - mariadb

  web:
    image: nginx:1.23.3-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - 8091:80
    depends_on:
      - laravel-api

  angular-ui:
    image: testsmith/practice-software-testing-sprint5-ui
    platform: linux/amd64
    ports:
      - 4200:4200
    command: bash -c "ng serve --host 0.0.0.0 --port 4200"
