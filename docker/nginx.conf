# nginx in front of the Toolshop API: passes requests to PHP-FPM in the laravel-api container.
server {
    listen 80;
    root /var/www/public;

    location / {
        try_files $uri /index.php?$args;
    }

    # Server-sent events: pass them to PHP without buffering,
    # otherwise nginx holds the events back until the stream ends.
    location = /sales-stream {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_buffering off;
        fastcgi_read_timeout 3600s;
    }

    location ~ \.php$ {
        fastcgi_pass laravel-api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
